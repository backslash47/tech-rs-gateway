<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780">
  <title>Reference 40 by 60 mm perfboard assembly, component-side view</title>
  <desc>ESP pins C3 through C10 and L3 through L10, USB at top. MAX3232 supply contacts E16 negative, E17 positive, J18 positive and J19 negative. Isolated pads are connected by wires; dashed signal leads end at converter terminals, not invented pad positions.</desc>
  <defs>
    <pattern id="pads" x="65" y="92" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="11" cy="11" r="3" fill="#c4a666"/>
    </pattern>
  </defs>
  <rect width="1000" height="780" fill="white"/>
  <g font-family="sans-serif" fill="#213547">
    <text x="30" y="34" font-size="22" font-weight="bold">Reference assembly · top / component side</text>
    <text x="30" y="61" font-size="14">40 × 60 mm perfboard · 2.54 mm pitch · schematic placement, not a manufacturing drawing</text>
    <rect x="60" y="84" width="330" height="480" rx="14" fill="#fcf9ed" stroke="#ae976a"/>
    <rect x="65" y="92" width="308" height="440" fill="url(#pads)"/>
    <g font-size="12" text-anchor="middle">
      <text x="76" y="79">A</text><text x="120" y="79">C</text><text x="164" y="79">E</text>
      <text x="274" y="79">J</text><text x="318" y="79">L</text><text x="362" y="79">N</text>
    </g>
    <g font-size="12" text-anchor="end">
      <text x="54" y="107">1</text><text x="54" y="151">3</text><text x="54" y="173">4</text>
      <text x="54" y="283">9</text><text x="54" y="305">10</text><text x="54" y="437">16</text>
      <text x="54" y="459">17</text><text x="54" y="481">18</text><text x="54" y="503">19</text>
      <text x="54" y="525">20</text>
    </g>
    <rect x="106" y="121" width="226" height="213" rx="8" fill="#274c67" fill-opacity=".92"/>
    <rect x="190" y="105" width="58" height="28" rx="5" fill="#d5dfe6" stroke="#526779"/>
    <g fill="white" text-anchor="middle">
      <text x="219" y="193" font-size="17">ESP32-C3-LPKit</text>
      <text x="219" y="218" font-size="15">v4.0</text>
      <text x="219" y="321" font-size="13">antenna end</text>
    </g>
    <g fill="#e3c574" stroke="#6c5937">
      <circle cx="120" cy="147" r="5"/><circle cx="120" cy="169" r="5"/><circle cx="120" cy="191" r="5"/><circle cx="120" cy="213" r="5"/>
      <circle cx="120" cy="235" r="5"/><circle cx="120" cy="257" r="5"/><circle cx="120" cy="279" r="5"/><circle cx="120" cy="301" r="5"/>
      <circle cx="318" cy="147" r="5"/><circle cx="318" cy="169" r="5"/><circle cx="318" cy="191" r="5"/><circle cx="318" cy="213" r="5"/>
      <circle cx="318" cy="235" r="5"/><circle cx="318" cy="257" r="5"/><circle cx="318" cy="279" r="5"/><circle cx="318" cy="301" r="5"/>
    </g>
    <rect x="147" y="406" width="144" height="111" rx="8" fill="#255d54"/>
    <text x="219" y="445" fill="white" text-anchor="middle" font-size="16">MAX3232</text>
    <text x="158" y="492" fill="white" font-size="11">RS232</text><text x="254" y="432" fill="white" font-size="11">TTL</text>
    <g fill="#e3c574" stroke="#6c5937">
      <circle cx="164" cy="433" r="5"/><circle cx="164" cy="455" r="5"/>
      <circle cx="274" cy="477" r="5"/><circle cx="274" cy="499" r="5"/>
    </g>
    <g stroke-width="3" fill="none">
      <path d="M318 147 H354 V477 H274" stroke="#bf5943"/>
      <path d="M120 169 H89 V545 H310 V499 H274" stroke="#687c89"/>
      <path d="M318 169 H340 V380 H285 V460" stroke="#40945f" stroke-dasharray="6 4"/>
      <path d="M318 279 H330 V391 H300 V450 H285" stroke="#267ca3" stroke-dasharray="6 4"/>
      <path d="M164 433 H137 V600" stroke="#b19c17"/>
    </g>
    <g font-size="16">
      <text x="440" y="121" font-weight="bold">Placement confirmed during the reference build</text>
      <text x="440" y="157">ESP left row: C3–C10 · right row: L3–L10</text>
      <text x="440" y="185">USB faces the top edge; no step-down converter.</text>
      <text x="440" y="233" font-weight="bold">Supply jumpers (may be soldered underneath)</text>
      <text x="440" y="265">L3 · switched 3.3 V → J18 · MAX +</text>
      <text x="440" y="293">C4 · ESP GND → J19 · MAX −</text>
      <text x="440" y="321">E16 · MAX − → controller GND</text>
      <text x="440" y="349">Both + pads and both − pads are internally paired.</text>
      <text x="440" y="397" font-weight="bold">Signal leads (dashed, exact pad positions not assumed)</text>
      <text x="440" y="429">L4 · GPIO5 ← MAX TTL output</text>
      <text x="440" y="457">L9 · GPIO3 → MAX TTL input</text>
      <text x="440" y="485">TECH TX → MAX RS232 input</text>
      <text x="440" y="513">TECH RX ← MAX RS232 output</text>
      <text x="440" y="561" font-weight="bold">Reading this drawing</text>
      <text x="440" y="593">Coordinates are from the component side.</text>
      <text x="440" y="621">The solder-side view is mirrored.</text>
      <text x="440" y="649">Adjacent pads are not connected.</text>
      <text x="440" y="677">Use insulated jumpers where routes cross.</text>
    </g>
    <text x="30" y="725" font-size="14">Converter appearance and signal-terminal placement are illustrative. Follow its actual TTL/RS232 markings.</text>
    <text x="30" y="751" font-size="14">Original project drawing replaces photographs; it is not a photograph or a claim of a standardized MAX3232 module footprint.</text>
  </g>
</svg>
